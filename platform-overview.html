<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neverland Ventures - Platform Overview">
    <title>Platform Overview - Neverland Ventures</title>
    <link rel="icon" type="image/png" href="Neverland Ventures (1)Artboard 4@4x.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Skia, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.7;
            color: #ffffff;
            background-color: #000000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5em;
            text-align: center;
        }

        .logo {
            width: 150px;
            height: auto;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 2em;
            display: block;
            filter: invert(1);
        }

        .overview-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 2em;
        }

        .back-link {
            text-align: center;
            margin-top: 2em;
        }

        .back-link a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #ffffff;
            transition: opacity 0.2s;
        }

        .back-link a:hover {
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .logo {
                width: 113px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="full logo white.png" alt="Neverland Ventures" class="logo">
        <h1>Platform Overview</h1>
        <img src="platform-overview.png" alt="Neverland Ventures Platform Overview" class="overview-image">
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
</body>
</html>
