<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neverland Ventures — A private investment platform focused on experiential real estate and operating businesses.">
    <title>Neverland Ventures</title>
    <link rel="icon" type="image/png" href="Neverland Ventures (1)Artboard 4@4x.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* ── Icons top-right ── */
        nav {
            position: fixed;
            top: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 32px 44px;
            z-index: 10;
        }

        .nav-icon-link {
            display: flex;
            align-items: center;
            color: #e87722;
            text-decoration: none;
            transition: opacity 0.25s ease;
        }

        .nav-icon-link:hover {
            opacity: 0.7;
        }

        .nav-icon-link svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* ── Centered feather ── */
        .feather-wrap {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feather-img {
            width: min(520px, 75vmin);
            height: auto;
        }

        @media (max-width: 480px) {
            nav {
                padding: 22px 24px;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="mailto:info@neverland.vc" class="nav-icon-link" aria-label="Email Neverland Ventures">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
        </a>
        <a href="https://www.linkedin.com/company/neverlandvc/" target="_blank" rel="noopener noreferrer" class="nav-icon-link" aria-label="Neverland Ventures on LinkedIn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
            </svg>
        </a>
    </nav>

    <div class="feather-wrap">
        <img
            class="feather-img"
            src="feather_titanium.gif"
            alt="Neverland Ventures"
        >
    </div>

</body>
</html>
